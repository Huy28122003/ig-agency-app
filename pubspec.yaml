name: ig_agency_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Navigation
  auto_route: ^10.1.1

  # Network
  dio: ^5.9.0
  retrofit: ^4.7.1

  # Logger
  logger: ^2.6.1
  pretty_dio_logger: ^1.4.0

  # DIP
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Notification
  flutter_local_notifications: ^19.4.0
#  firebase_messaging: ^16.0.0

  # Code generator
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Localization
  easy_localization: ^3.0.8

  # Discovering the state of the network
  connectivity_plus: ^6.1.5

  # Camera
  camera: ^0.11.2
  video_player: ^2.10.0
  image_picker: ^1.2.0
  image_gallery_saver_plus: ^4.0.1

  # Permission
  permission_handler: ^12.0.1

  # Crop image
  image_cropper: ^9.1.0

  # Other
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  responsive_builder: ^0.7.1
  one_context: ^4.1.0
  flutter_svg: ^2.0.13
  flutter_native_splash: ^2.4.6
  otp_pin_field: ^1.4.1
  pull_to_refresh_flutter3: ^2.0.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  card_loading: ^0.3.2
  path: ^1.9.1
  dartx: ^1.2.0
  rxdart: ^0.28.0
  metadata_fetch: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generating files
  retrofit_generator: ^10.0.2
  build_runner: ^2.7.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1
  flutter_gen_runner: ^5.11.0

  auto_route_generator: ^10.2.4
#  lean_builder: ^0.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/segoe_ui/Segoe UI.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/segoe_ui/Segoe UI Semibold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI Semibold Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/segoe_ui/Segoe UI Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI BoldItalic.ttf
          weight: 700
          style: italic

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true