name: ig_agency_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Navigation
  auto_route: ^10.1.1

  # Network
  dio: ^5.9.0
  retrofit: ^4.7.1

  # Logger
  logger: ^2.6.1
  pretty_dio_logger: ^1.4.0

  # DIP
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Notification
  flutter_local_notifications: ^19.4.0
  firebase_messaging: ^16.0.0

  # Code generator
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Localization
  #  easy_localization: ^3.0.8

  # Discovering the state of the network
  connectivity_plus: ^6.1.5

  # Other
  responsive_builder: ^0.7.1
  one_context: ^4.1.0
  flutter_svg: ^2.0.13
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generating files
  retrofit_generator: ^10.0.2
  build_runner: ^2.7.0
  json_serializable: ^6.10.0
  injectable_generator: ^2.8.1
  flutter_gen_runner: ^5.11.0

  auto_route_generator: ^10.2.4
#  lean_builder: ^0.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/segoe_ui/Segoe UI.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/segoe_ui/Segoe UI Semibold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI Semibold Italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/segoe_ui/Segoe UI Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/segoe_ui/Segoe UI BoldItalic.ttf
          weight: 700
          style: italic

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true